<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navigation Frame</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #F3EDDF;
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 28px;
            border-bottom: 1px solid #D8CEB9;
        }

        nav {
            display: flex;
            gap: 32px;
            align-items: center;
            width: 100%;
        }

        .nav-label {
            display: none;
        }

        .nav-link {
            color: #2A2416;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 6px 0;
            border-radius: 0;
            border: none;
            position: relative;
            background: transparent;
            transition: color 0.15s ease;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #A66B1E;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.2s ease;
        }

        .nav-link:hover, .nav-link:focus {
            background-color: transparent;
            color: #A66B1E;
            border-color: transparent;
        }

        .nav-link:hover::after, .nav-link:focus::after {
            transform: scaleX(1);
        }
    </style>
</head>
<body>
    <nav>
        <span class="nav-label">Navigation:</span>
        <!-- Note target="mainFrame" ensures content opens strictly inside the 3rd frame -->
        <a href="main.html" target="mainFrame" class="nav-link">Home</a>
        <a href="about.html" target="mainFrame" class="nav-link">About</a>
        <a href="gallery.html" target="mainFrame" class="nav-link">Gallery</a>
    </nav>
</body>
</html>
