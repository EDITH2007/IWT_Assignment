<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <!-- SVG Container Canvas: Sharp 1px Hairline Border, Cream Background -->
  <rect width="600" height="220" rx="0" fill="#FBF7EE" stroke="#D8CEB9" stroke-width="1" />

  <!-- Outer Canvas Title Banner -->
  <text x="300" y="20" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700" fill="#2A2416" text-anchor="middle" letter-spacing="0.5">
    GGITS CAMPUS INTERACTIVE MAP (CLIENT-SIDE IMAGE MAP DEMO)
  </text>

  <!-- ================================================================= -->
  <!-- 1. CIRCLE ZONE: CENTER (110, 110), RADIUS 85                     -->
  <!-- ================================================================= -->
  <g>
    <circle cx="110" cy="110" r="85" fill="#F5EFE0" stroke="#A66B1E" stroke-width="1.5" />
    <!-- Inner Decorative Circle -->
    <circle cx="110" cy="110" r="75" fill="none" stroke="#CFC3A9" stroke-width="1" stroke-dasharray="3 3" />
    <!-- Info Icon -->
    <rect x="101" y="73" width="18" height="18" fill="#A66B1E" rx="0" />
    <text x="110" y="86" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#FBF7EE" text-anchor="middle">i</text>
    <!-- Label -->
    <text x="110" y="115" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="bold" fill="#2A2416" text-anchor="middle">About Us</text>
    <text x="110" y="133" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#8C5919" text-anchor="middle">Clickable Circle Zone</text>
    <text x="110" y="149" font-family="'Inter', sans-serif" font-size="10" fill="#655B49" text-anchor="middle">(cx=110, cy=110, r=85)</text>
  </g>

  <!-- ================================================================= -->
  <!-- 2. RECTANGLE ZONE: (260, 25) TO (560, 195) -> W:300, H:170        -->
  <!-- ================================================================= -->
  <g>
    <rect x="260" y="25" width="300" height="170" rx="0" fill="#F5EFE0" stroke="#A66B1E" stroke-width="1.5" />
    <!-- Inner Decorative Rect -->
    <rect x="268" y="33" width="284" height="154" rx="0" fill="none" stroke="#CFC3A9" stroke-width="1" stroke-dasharray="4 3" />
    <!-- Gallery Icon Placeholder -->
    <rect x="390" y="55" width="40" height="28" rx="0" fill="#A66B1E" />
    <polygon points="395,78 405,66 415,73 422,63 425,78" fill="#FBF7EE" />
    <circle cx="420" cy="62" r="2.5" fill="#FBF7EE" />
    <!-- Label -->
    <text x="410" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" fill="#2A2416" text-anchor="middle">Campus Gallery</text>
    <text x="410" y="132" font-family="'Inter', sans-serif" font-size="11.5" font-weight="500" fill="#8C5919" text-anchor="middle">Clickable Rectangle Zone</text>
    <text x="410" y="149" font-family="'Inter', sans-serif" font-size="10" fill="#655B49" text-anchor="middle">(coords="260,25,560,195")</text>
  </g>
</svg>
