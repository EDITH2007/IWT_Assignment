<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>

    <!-- Circle Zone Gradient -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Rect Zone Gradient -->
    <linearGradient id="rectGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Shadow Effect -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#002147" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- SVG Container Canvas -->
  <rect width="600" height="220" rx="8" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="2" />

  <!-- Outer Canvas Title Banner -->
  <text x="300" y="18" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#002147" text-anchor="middle" letter-spacing="1">
    GGITS CAMPUS INTERACTIVE MAP (CLIENT-SIDE IMAGE MAP DEMO)
  </text>

  <!-- ================================================================= -->
  <!-- 1. CIRCLE ZONE: CENTER (110, 110), RADIUS 85                     -->
  <!-- ================================================================= -->
  <g filter="url(#shadow)">
    <circle cx="110" cy="110" r="85" fill="url(#circleGrad)" stroke="#002147" stroke-width="3" />
    <!-- Inner Decorative Circle -->
    <circle cx="110" cy="110" r="75" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 3" />
    <!-- Info Icon -->
    <circle cx="110" cy="85" r="14" fill="#002147" />
    <text x="110" y="91" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">i</text>
    <!-- Label -->
    <text x="110" y="118" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#002147" text-anchor="middle">About Us</text>
    <text x="110" y="136" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#0369a1" text-anchor="middle">Clickable Circle Zone</text>
    <text x="110" y="152" font-family="'Segoe UI', sans-serif" font-size="10" fill="#475569" text-anchor="middle">(cx=110, cy=110, r=85)</text>
  </g>

  <!-- ================================================================= -->
  <!-- 2. RECTANGLE ZONE: (260, 25) TO (560, 195) -> W:300, H:170        -->
  <!-- ================================================================= -->
  <g filter="url(#shadow)">
    <rect x="260" y="25" width="300" height="170" rx="10" fill="url(#rectGrad)" stroke="#002147" stroke-width="3" />
    <!-- Inner Decorative Rect -->
    <rect x="268" y="33" width="284" height="154" rx="6" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 3" />
    <!-- Gallery Icon Placeholder -->
    <rect x="390" y="55" width="40" height="30" rx="4" fill="#002147" />
    <polygon points="395,80 405,68 415,75 422,65 425,80" fill="#ffffff" />
    <circle cx="420" cy="62" r="3" fill="#fbbf24" />
    <!-- Label -->
    <text x="410" y="112" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" fill="#002147" text-anchor="middle">Campus Gallery</text>
    <text x="410" y="134" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">Clickable Rectangle Zone</text>
    <text x="410" y="152" font-family="'Segoe UI', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(coords="260,25,560,195")</text>
  </g>
</svg>
