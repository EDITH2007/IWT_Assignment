<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - GGITS IWT Practical</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            padding: 24px;
            line-height: 1.6;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            border-top: 5px solid #002147;
            border-radius: 8px;
            padding: 24px;
            max-width: 700px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #002147;
            font-size: 22px;
            margin-bottom: 12px;
        }

        .zone-badge {
            display: inline-block;
            background-color: #f1f5f9;
            color: #334155;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid #cbd5e1;
            margin-bottom: 16px;
        }

        p {
            color: #475569;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .gallery-preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 16px 0 20px 0;
        }

        .gallery-box {
            background-color: #e2e8f0;
            border-radius: 6px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #002147;
            font-weight: bold;
            font-size: 12px;
            border: 1px dashed #94a3b8;
        }

        .back-btn {
            display: inline-block;
            background-color: #002147;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.2s ease;
        }

        .back-btn:hover {
            background-color: #1e3a8a;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Campus Gallery Page</h2>
        <div class="zone-badge">Image Map Triggered: RECTANGLE Zone (coords="260,25,560,195")</div>
        
        <p>
            You have successfully navigated here by clicking the <b>Rectangle Region</b> on the client-side campus map!
        </p>

        <div class="gallery-preview-grid">
            <div class="gallery-box">Lab Photo 1</div>
            <div class="gallery-box">Campus Photo 2</div>
            <div class="gallery-box">Library Photo 3</div>
        </div>

        <a href="main.html" target="mainFrame" class="back-btn">&larr; Back to Home</a>
    </div>

</body>
</html>
