<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - GGITS IWT Practical</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #FBF7EE;
            color: #2A2416;
            padding: 32px 36px;
            line-height: 1.65;
        }

        .card {
            background-color: #FFFFFF;
            border: 1px solid #D8CEB9;
            border-top: 3px solid #A66B1E;
            border-radius: 0;
            padding: 28px 32px;
            max-width: 680px;
            box-shadow: none;
        }

        h2 {
            font-family: 'Merriweather', Georgia, serif;
            color: #2A2416;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 14px;
            letter-spacing: -0.2px;
        }

        .zone-badge {
            display: block;
            background-color: #F5EFE0;
            color: #8C5919;
            padding: 6px 12px;
            border-left: 2px solid #A66B1E;
            border-radius: 0;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        p {
            color: #423B2D;
            font-size: 14px;
            margin-bottom: 16px;
            max-width: 65ch;
            text-align: left;
        }

        .gallery-preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 20px 0 24px 0;
        }

        .gallery-box {
            background-color: #F5EFE0;
            border-radius: 0;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2A2416;
            font-family: 'Merriweather', Georgia, serif;
            font-weight: 700;
            font-size: 12.5px;
            border: 1px solid #D8CEB9;
        }

        .back-btn {
            display: inline-block;
            background-color: transparent;
            color: #A66B1E;
            border: 1px solid #A66B1E;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 0;
            font-family: 'Inter', system-ui, sans-serif;
            font-size: 13px;
            font-weight: 600;
            transition: background-color 0.15s ease, color 0.15s ease;
        }

        .back-btn:hover {
            background-color: #A66B1E;
            color: #FBF7EE;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Campus Gallery Page</h2>
        <div class="zone-badge">Image Map Triggered: RECTANGLE Zone (coords="260,25,560,195")</div>
        
        <p>
            You have successfully navigated here by clicking the <b>Rectangle Region</b> on the client-side campus map!
        </p>

        <div class="gallery-preview-grid">
            <div class="gallery-box">Lab Photo 1</div>
            <div class="gallery-box">Campus Photo 2</div>
            <div class="gallery-box">Library Photo 3</div>
        </div>

        <a href="main.html" target="mainFrame" class="back-btn">&larr; Back to Home</a>
    </div>

</body>
</html>
