<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Banner Header</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #FBF7EE;
            color: #2A2416;
            height: 100vh;
            display: flex;
            align-items: center;
            padding: 0 28px;
            border-bottom: 1px solid #D8CEB9;
            overflow: hidden;
        }

        .header-container {
            display: flex;
            align-items: center;
            gap: 18px;
            width: 100%;
        }

        /* Square Logo Badge */
        .logo-badge {
            width: 48px;
            height: 48px;
            border-radius: 0;
            background-color: #A66B1E;
            color: #FBF7EE;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Merriweather', Georgia, serif;
            font-weight: 700;
            font-size: 19px;
            box-shadow: none;
            border: none;
            flex-shrink: 0;
        }

        .title-area {
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-family: 'Merriweather', Georgia, serif;
            color: #2A2416;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.2px;
            line-height: 1.25;
        }

        .subtitle {
            font-family: 'Inter', system-ui, sans-serif;
            color: #655B49;
            font-size: 12.5px;
            font-weight: 400;
            margin-top: 3px;
        }

        .university-tag {
            display: inline-block;
            background-color: transparent;
            color: #A66B1E;
            padding: 0 0 0 8px;
            border-left: 1px solid #D8CEB9;
            border-radius: 0;
            font-size: 12px;
            font-weight: 500;
            margin-left: 6px;
        }
    </style>
</head>
<body>
    <header class="header-container">
        <!-- Circular Logo Placeholder -->
        <div class="logo-badge" title="GGITS Logo Placeholder">GG</div>
        
        <div class="title-area">
            <h1>Gyan Ganga Institute of Technology and Sciences</h1>
            <p class="subtitle">
                Internet &amp; Web Technology (IWT) | 5th Semester 
                <span class="university-tag">RGPV University</span>
            </p>
        </div>
    </header>
</body>
</html>
